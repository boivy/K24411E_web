<html> 
    <head>
        <title> Tiêu đề trang</title>
        <style>
            h1{
            text-align: center;
            font-size: 50px;
            color: #ffffff;
            }
            label{
                color: #ffffff;
                font-size: 20px;
            }
            body{
                background-color: #1b746a;
                font-family: Times New Roman;
            }
        </style>
    </head>
    <body>
        <div align="center">
            <img src="Logo.gif">
        </div>
        <h1>Newborn Registration</h1>
        <form>
            <div style="margin-bottom: 10px;">
                <label style="width: 150px;">
                    Date:
                </label>
                <input type="text" placeholder="mm/dd/yy">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="width: 150px;display: inline-block;">
                    1) Infant's Name:
                </label>
                <input type="text">
                <label style="margin-left: 20px;display: inline-block;">
                    Last:
                </label>
                <input type="text">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="width: 150px;">
                    2) Medical Record#:
                </label>
                <input type="text">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="width: 150px;">
                    3) Date of birth:
                </label>
                <input type="text" placeholder="mm/dd/yy">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="width: 150px;">
                    4) Birth weight:
                </label>
                <input type="text">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="width: 150px;">
                    5) APGAR score:
                </label>
                <input type="text">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="width: 150px;">
                    6) Mother's Name:
                </label>
                <input type="text">
                <label style="margin-left: 20px;display: inline-block;">
                    Last:
                </label>
                <input type="text">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="width: 150px;display: inline-block;">
                    7) Father's Name:
                </label>
                <input type="text">
                <label style="margin-left: 20px;display: inline-block;">
                    Last:
                </label>
                <input type="text">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="width: 150px;">
                    8) Physician (check all that apply):
                </label>
                <select multiple size="4">

                            <option>Dr. Warren Albert</option>
                            <option>Dr. Maria Alvarez</option>
                            <option>Dr. Karen Brinkman</option>
                            <option>Dr. Micheal Kerry</option>

                </select>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <input type="submit" value="Register" onclick="alert('Registration successful!')">
                <input type="reset" value="Cancel">
            </div>
        </form>
        
    </body>
</html>
