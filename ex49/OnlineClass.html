<html>
    <head>
        <title>Online Classifieds Search Form</title>
        <style>
            body{
                background-color: lightgray;
                font-family: Arial;
            }
            .box{
                width: 600px;
                background-color: #ccffff;
                border: 2px solid blue;
                padding: 20px;
                margin: auto;
            }
            h2{
                color: red;
            }
            textarea{
                width: 500px;
                height: 40px;
            }
            img{
                cursor: pointer;
            }
            label{
                margin-right: 15px;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <form id="myForm">
                <h2>Online Classifieds Search Form</h2>
                <hr size="3" color="brown">
                <p>
                    <b>1) Search for a classified in the following sections:</b>
                </p>
                <label>
                    <input type="radio" name="a"> Employment
                </label>
                <label>
                    <input type="radio" name="a"> Personal
                </label>
                <br><br>
                <label>
                    <input type="radio" name="a"> For Sale
                </label>
                <label>
                    <input type="radio" name="a"> Miscellaneous
                </label>
                <br><br>
                <label>
                    <input type="radio" name="a"> Housing
                </label>
                <label>
                    <input type="radio" name="a"> All of the above
                </label>
                <p>
                    <b>2) Search the following publications:</b>
                </p>
                <label>
                    <input type="checkbox"> Midwest times
                </label>
                <label>
                    <input type="checkbox"> Modern News
                </label>
                <label>
                    <input type="checkbox"> Employment Today
                </label>
                <br><br>
                <label>
                    <input type="checkbox"> Great Lakes Classifieds
                </label>
                <label>
                    <input type="checkbox"> Middletown Daily
                </label>
                <label>
                    <input type="checkbox"> Cashtown Daily News
                </label>
                <p>
                    <b>3) From</b>
                    <input type="text" placeholder="mm/dd/yy">
                    <b>to</b>
                    <input type="text" placeholder="mm/dd/yy">
                </p>
                <p>
                    <b>4) Enter a few keywords to describe the classified.</b>
                </p>
                <textarea></textarea>
                <p>
                    <b>5) Click one of the options below:</b>
                </p>
                <a href="search.html">
                    <img src="images/Search.gif" width="60">
                </a>
                &nbsp;&nbsp;
                <a href="help.html">
                    <img src="images/Help.gif" width="60">
                </a>
                &nbsp;&nbsp;
                <a href="OnlineClass.html">
                    <img src="images/Cancel.gif" width="60" alt="Cancel">
                </a>
            </form>
        </div>
    </body>
</html>
