<html>
    <head>
        <title>Tiêu đề trang</title>
        <style>
            body{
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #f2f2f2;
                font-family: Arial, Helvetica, sans-serif;
            }
            .login-box{
                background-color: white;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0 20px rgba(0,0,0,0.3);
            }
            table{
                border-collapse: collapse;
            }
            td{
                padding: 8px;
            }
            .title{
                text-align: center;
                font-size: 24px;
                font-weight: bold;
            }
            .btn{
                padding: 8px 15px;
            }
        </style>
    </head>
            <body>
            <div class="login-box">
            <form
                action="process_login.html"
                method="get"
                name="loginForm">
                <table border="1">
                    <tr>
                        <td rowspan="7">
                            <img src="images/ic_admin.png"
                            alt="Admin Page"
                            width="150" height="250">
                        </td>
                    </tr>
                    <tr>
                        <td class="title">
                            Login System
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="username">
                                User Name
                            </label>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="text"
                            name="username"
                            id="username"
                            value="obama"
                            required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Password:
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="password"
                            name="password"
                            value="123456"
                            required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="checkbox"
                            name="remember"
                            value="remember">
                            Remember me
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2"
                        style="text-align: center;">
                            <input type="submit"
                            value="Login"
                            class="btn">

                              |

                            <input type="reset"
                            value="Reset"
                            class="btn">
                        </td>
                    </tr>

                </table>

            </form>

        </div>

    </body>
</html>
